<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Work — Ebitdaa Ventures</title>
  <meta name="description" content="Websites designed and built by Ebitdaa Ventures.">
  <link rel="canonical" href="https://ebitdaaventures.com/work/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Our Work — Ebitdaa Ventures">
  <meta property="og:image" content="https://ebitdaaventures.com/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/work/site.css">
  <style>
    .work-hero { padding: 180px 0 72px; }
    .work-hero h1 { font-size: clamp(3rem, 9vw, 7.5rem); font-weight: 900; letter-spacing: -0.055em; line-height: .92; color: var(--text); }
    .work-hero h1 em { font-style: normal; color: var(--accent); }
    .work-intro { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-top: 48px; padding-top: 28px; border-top: 2px solid var(--text); align-items: start; }
    .work-intro p { font-size: 1.15rem; color: var(--text-muted); max-width: 520px; }
    .work-count { font-family: 'JetBrains Mono', monospace; font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--text-dim); text-align: right; }
    .work-section { padding: 8px 0 140px; position: relative; z-index: 1; }
    .work-grid { display: flex; flex-direction: column; gap: 96px; max-width: 1560px; margin: 0 auto; padding: 0 clamp(12px, 3vw, 48px); }
    .work-item { display: block; }
    .work-shot { display: block; position: relative; overflow: hidden; border-radius: 16px; background: #1F2124; border: 1px solid var(--border); box-shadow: 0 40px 80px -40px rgba(31,33,36,.45); transition: box-shadow .35s, transform .35s; }
    .work-shot img { width: 100%; height: auto; aspect-ratio: 16/10; object-fit: cover; object-position: top; display: block; transition: transform .8s cubic-bezier(.2,.7,.2,1), filter .35s; }
    .work-shot:hover, .work-shot:focus-visible { transform: translateY(-4px); box-shadow: 0 56px 100px -40px rgba(172,55,58,.38); outline: none; }
    .work-shot:hover img, .work-shot:focus-visible img { transform: scale(1.02); filter: brightness(1.04); }
    .work-shot .open { position: absolute; right: 20px; bottom: 20px; background: var(--accent); color: #fff; font-size: .85rem; font-weight: 600; padding: 10px 16px; border-radius: 10px; opacity: 0; transform: translateY(6px); transition: all .25s; }
    .work-shot:hover .open, .work-shot:focus-visible .open { opacity: 1; transform: none; }
    .work-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 22px 4px 0; }
    .work-meta h2 { font-size: clamp(1.4rem, 2.6vw, 2.2rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; }
    .work-num { font-family: 'JetBrains Mono', monospace; font-size: .8rem; color: var(--accent); margin-right: 14px; vertical-align: middle; }
    .work-url { font-family: 'JetBrains Mono', monospace; font-size: .82rem; color: var(--text); text-decoration: none; border-bottom: 1.5px solid var(--accent); padding-bottom: 2px; white-space: nowrap; }
    .work-url:hover { color: var(--accent); }
    .work-cta { border-top: 1px solid var(--border-subtle); padding: 96px 0; }
    .work-cta h2 { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 900; letter-spacing: -0.045em; line-height: 1; margin-bottom: 28px; }
    .work-cta h2 span { color: var(--accent); }
    .nav-links a[aria-current="page"] { color: var(--text); background: rgba(31,33,36,0.06); }
    @media (max-width: 768px) {
      .work-hero { padding: 130px 0 40px; }
      .work-intro { grid-template-columns: 1fr; gap: 16px; }
      .work-count { text-align: left; }
      .work-section { padding-bottom: 96px; }
      .work-grid { gap: 64px; }
      .work-shot { border-radius: 10px; }
      .work-meta { flex-direction: column; gap: 8px; padding-top: 16px; }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <nav id="navbar">
    <div class="container">
      <a href="/" class="logo" aria-label="Ebitdaa Ventures"><img src="/logo.png" alt="Ebitdaa Ventures"></a>
      <div class="nav-links">
        <a href="/#portfolio">Portfolio</a>
        <a href="/work/" aria-current="page">Work</a>
        <a href="/#about">About</a>
        <a href="/#contact" class="nav-cta">Get in Touch</a>
      </div>
      <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </nav>

  <main>
    <header class="work-hero">
      <div class="container">
        <div class="section-label">Ebitdaa Marketing — Selected work</div>
        <h1>Our <em>Work.</em></h1>
        <div class="work-intro">
          <p>Sites we've designed, built and launched. Click any to visit it live.</p>
          <div class="work-count" id="workCount"></div>
        </div>
      </div>
    </header>

    <section class="work-section" aria-label="Portfolio">
      <div>
        <div class="work-grid" id="workGrid"></div>
        <noscript><p><a href="https://juststoragemanagement.com">JustStorage Management</a> · <a href="https://tidzee.com">Tidzee</a> · <a href="https://tenforma.com">TenForma</a> · <a href="https://hojii.xyz">Hojii</a></p></noscript>
      </div>
    </section>

    <section class="work-cta">
      <div class="container">
        <div class="section-label">Next project</div>
        <h2>Need a site that<br><span>works this hard?</span></h2>
        <a href="https://cal.com/ebitdaa-marketing/ebitdaa-marketing-intro-call" target="_blank" rel="noopener" class="btn btn--primary">Book a call →</a>
        <a href="/assets/ebitdaa-marketing-offer.pdf" target="_blank" rel="noopener" class="btn btn--ghost">Packages &amp; pricing</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <div class="footer-inner">
        <div class="footer-left">&copy; 2026 Ebitdaa Ventures LLC</div>
        <div class="footer-right">
          <a href="/#contact">Contact</a>
          <a href="https://apps.apple.com/us/app/wdyw/id6761072597" target="_blank" rel="noopener">App Store</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    // ── Portfolio data: add a site = add one object ──
    const WORK = [
      {
        title: "JustStorage Management",
        url: "https://juststoragemanagement.com",
        image: "/work/assets/juststoragemanagement.webp",
        fallback: "/work/assets/juststoragemanagement.jpg"
      },
      {
        title: "Tidzee",
        url: "https://tidzee.com",
        image: "/work/assets/tidzee.webp",
        fallback: "/work/assets/tidzee.jpg"
      },
      {
        title: "TenForma",
        url: "https://tenforma.com",
        image: "/work/assets/tenforma.webp",
        fallback: "/work/assets/tenforma.jpg"
      },
      {
        title: "Hojii",
        url: "https://hojii.xyz",
        image: "/work/assets/hojii.webp",
        fallback: "/work/assets/hojii.jpg"
      },
    ];

    const grid = document.getElementById('workGrid');
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    grid.innerHTML = WORK.map((w, i) => {
      const host = esc(new URL(w.url).hostname.replace(/^www\./, ''));
      return `
      <article class="work-item">
        <a class="work-shot" href="${esc(w.url)}" target="_blank" rel="noopener" aria-label="Open ${esc(w.title)} live site (new tab)">
          <picture>
            <source srcset="${esc(w.image)}" type="image/webp">
            <img src="${esc(w.fallback || w.image)}" alt="${esc(w.title)} website" width="2880" height="1800" loading="${i < 1 ? 'eager' : 'lazy'}">
          </picture>
          <span class="open">Visit site ↗</span>
        </a>
        <div class="work-meta">
          <h2><span class="work-num">${String(i + 1).padStart(2, '0')}</span>${esc(w.title)}</h2>
          <a class="work-url" href="${esc(w.url)}" target="_blank" rel="noopener">${host} ↗</a>
        </div>
      </article>`;}).join('');
    document.getElementById('workCount').textContent = `${String(WORK.length).padStart(2, '0')} ${WORK.length === 1 ? 'project' : 'projects'} `;

    // nav scroll + mobile menu (same behavior as homepage)
    const nav = document.getElementById('navbar');
    addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 20));
    const t = document.getElementById('mobileToggle'), links = document.querySelector('.nav-links');
    t.addEventListener('click', () => {
      const hidden = getComputedStyle(links).display === 'none';
      Object.assign(links.style, hidden ? {display:'flex',position:'absolute',top:'76px',left:'0',right:'0',flexDirection:'column',padding:'16px 24px',background:'rgba(255,255,255,0.97)',borderBottom:'1px solid var(--border-subtle)',gap:'4px'} : {display:'none'});
    });
  </script>
</body>
</html>
